services:
  recipe-search:
    build:
      context: .
      args:
        MAX_RECIPES: "10000"
        EMBEDDING_PARALLEL_WORKERS: "1"
    image: omai-recipe-search:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-5.6-luna}
      AZURE_OPENAI_USE_ENTRA: ${AZURE_OPENAI_USE_ENTRA:-false}
      MAX_RECIPES: "10000"
    restart: unless-stopped
