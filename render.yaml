services:
  - type: web
    name: omai-recipe-search
    runtime: docker
    plan: 1c-2g
    region: frankfurt
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: MAX_RECIPES
        value: "10000"
      - key: SEMANTIC_ENABLED
        value: "true"
      - key: EMBEDDING_PARALLEL_WORKERS
        value: "1"
      - key: AZURE_OPENAI_DEPLOYMENT
        value: gpt-5.6-luna
      - key: AZURE_OPENAI_REASONING_EFFORT
        value: low
