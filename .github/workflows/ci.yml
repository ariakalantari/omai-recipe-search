name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Keep the type-checker's configured target and CI interpreter aligned.
          # Runtime compatibility with 3.12 is exercised by the Docker workflow.
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[all,dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          mypy src
      - name: Test
        run: pytest
