name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep the type-checker's configured target and CI interpreter aligned.
          # Runtime compatibility with 3.12 is exercised by the Docker workflow.
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install uv==0.11.23
          uv sync --frozen --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
      - name: Test
        run: uv run pytest
