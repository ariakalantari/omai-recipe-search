name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Keep the type-checker's configured target and CI interpreter aligned.
          # Runtime compatibility with 3.12 is exercised by the Docker workflow.
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install uv==0.11.23
          uv sync --frozen --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
      - name: Test
        run: uv run pytest
